name: Build KidWatch APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblldb-dev \
            libffi-dev liblzma-dev readline-common libreadline-dev libncurses5-dev \
            libncursesw5-dev libdb-dev time pdftk zip unzip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Clean and Build APK
      run: |
        rm -rf .buildozer bin
        buildozer -v android debug
      env:
        P4A_RELEASE_STORAGE: https://github.com/kivy/python-for-android/releases/download

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KidWatch-APK
        path: bin/*.apk